<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0d0d;
            color: #f5e6d3;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 560px;
        }

        .code {
            font-size: clamp(80px, 18vw, 160px);
            font-weight: 800;
            letter-spacing: -4px;
            color: #d10000;
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(22px, 4vw, 32px);
            margin-bottom: 12px;
            color: #f5e6d3;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #aaa;
            margin-bottom: 32px;
        }

        .quote {
            font-style: italic;
            color: #d8b27a;
            margin-bottom: 32px;
            font-size: 15px;
        }

        a.btn {
            display: inline-block;
            padding: 12px 28px;
            background: #d10000;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }

        a.btn:hover {
            background: #a00000;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Esta página se ha perdido en el Vacío</h1>
        <p class="quote">"El que busca encuentra, pero a veces lo que encuentra no es lo que buscaba."</p>
        <p>La URL a la que has intentado acceder no existe o ha sido movida.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>

</html>
